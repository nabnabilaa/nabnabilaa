<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="52" viewBox="0 0 600 52" role="img" aria-label="Open Otopia Auto Care">
<title>Open Otopia Auto Care</title>
<defs>
<style>@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400 800;src:url(data:font/woff2;base64,) format('woff2')}
.serif{font-family:'Fraunces',Georgia,serif;font-weight:400}
.it{font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:360}
.sans{font-family:'Inter',system-ui,sans-serif}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.ink{fill:#F3EEE5}.ink2{fill:#D8D1C4}.muted{fill:#A69E90}.faint{fill:#7C7468}.acc{fill:#E2794F}
@keyframes rise{from{transform:translateY(108%)}}
@keyframes fade{from{opacity:0;transform:translateY(14px)}}
@keyframes fadein{from{opacity:0}}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes growy{from{transform:scaleY(0)}}
.rise{transform-box:fill-box;animation:rise 1s cubic-bezier(.23,1,.32,1) both}
.fade{transform-box:fill-box;animation:fade .9s cubic-bezier(.23,1,.32,1) both}
.fadein{animation:fadein 1.2s cubic-bezier(.23,1,.32,1) both}
.draw{stroke-dasharray:1;animation:draw 1.8s cubic-bezier(.77,0,.175,1) both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.23,1,.32,1) both}
.growy{transform-box:fill-box;transform-origin:center top;animation:growy 1.4s cubic-bezier(.23,1,.32,1) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 0.09"/></feComponentTransfer></filter>
<pattern id="kawung" width="64" height="64" patternUnits="userSpaceOnUse"><g fill="none" stroke="#F3EEE5" stroke-width="1"><ellipse cx="20" cy="20" rx="8" ry="15" transform="rotate(45 20 20)"/><ellipse cx="44" cy="20" rx="8" ry="15" transform="rotate(-45 44 20)"/><ellipse cx="20" cy="44" rx="8" ry="15" transform="rotate(-45 20 44)"/><ellipse cx="44" cy="44" rx="8" ry="15" transform="rotate(45 44 44)"/><circle cx="32" cy="32" r="2.5"/></g></pattern>
<filter id="lift" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="rgb(0,0,0)" flood-opacity=".16"/><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgb(0,0,0)" flood-opacity=".06"/></filter>
</defs>
<text x="40" y="30" class="mono acc" font-size="15" font-weight="500">pos-car-wash.vercel.app ↗</text>
</svg>